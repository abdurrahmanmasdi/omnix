name: Python tests
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      # Synthetic values only: tests mock the database and every model call (KI-057).
      # The cross-service contract checks run in the backend workflow's quality gate.
      - name: Run pytest
        env:
          OPENAI_API_KEY: synthetic-test-key
          INTERNAL_RPC_SECRET: synthetic-rpc-secret
          DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:5432/omnix_synthetic
        run: python -m pytest -q
